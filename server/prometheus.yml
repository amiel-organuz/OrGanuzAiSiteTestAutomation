global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: organuz-ai-fastapi-server

  # QA test metrics (qa_playwright_*) are pushed here by scripts/push-qa-metrics.mjs
  # at the end of each run. honor_labels keeps the pushed job/instance labels so the
  # metrics are not relabelled to the pushgateway target.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
