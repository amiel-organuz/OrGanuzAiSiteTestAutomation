name: Parallel Test Automation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: parallel-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  tests:
    name: Playwright ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - organuz-api
          - dev-api

    env:
      CI: true
      PLAYWRIGHT_MERGE_REPORTS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: matrix.project == 'chromium'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright project
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload blob report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

  product-smoke:
    name: Playwright product smoke (prod)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20

    env:
      CI: true
      # Prod has no dev/test password gate, so the @smoke shell tests need no secrets.
      QA_TARGET_ENV: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run credential-free product smoke against prod
        run: npx playwright test --project=product --grep @smoke

      - name: Upload Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-product-smoke
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

  services-smoke:
    name: FastAPI, Scalar, Prometheus, Grafana
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start service stack
        run: docker compose up -d --build api swagger prometheus grafana

      - name: Wait for service endpoints
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null \
              && curl -fsS http://localhost:8080 >/dev/null \
              && curl -fsS http://localhost:9092/-/ready >/dev/null \
              && curl -fsS http://localhost:3001/api/health >/dev/null; then
              echo "Service stack is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs api swagger prometheus grafana
          exit 1

      - name: Add service links to summary
        if: always()
        run: |
          {
            echo "## Runtime Servers"
            echo
            echo "These are in-runner ports, reachable only from inside this ephemeral job while it runs — not clickable from your browser. Rendered as code, not links, on purpose."
            echo
            echo "| Server | In-runner port |"
            echo "| --- | --- |"
            echo "| FastAPI | \`localhost:8000\` |"
            echo "| Scalar | \`localhost:8080\` |"
            echo "| Grafana | \`localhost:3001\` |"
            echo "| Prometheus | \`localhost:9092\` |"
            echo "| Allure | Published by the report job to GitHub Pages and uploaded as an artifact |"
            echo
            echo "For externally reachable links in the final summary, set the \`FASTAPI_URL\`, \`SWAGGER_URL\`, and \`GRAFANA_URL\` repository variables."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload service logs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p service-logs
          docker compose logs api swagger prometheus grafana > service-logs/docker-compose-services.log

      - name: Store service logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: service-logs/
          if-no-files-found: ignore
          retention-days: 14

  publish-allure:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - tests
      - product-smoke
    if: always()
    timeout-minutes: 15
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL || 'http://localhost:3001' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: collected-allure-results
          merge-multiple: true

      - name: Generate Allure report
        run: |
          if find collected-allure-results -type f -print -quit 2>/dev/null | grep -q .; then
            npx -y -p allure@3 allure generate collected-allure-results --output allure-report
          else
            mkdir -p allure-report
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '  <h1>No Allure results were produced</h1>' \
              '  <p>The workflow completed without downloadable Allure result artifacts.</p>' \
              '</body>' \
              '</html>' \
              > allure-report/index.html
          fi

      - name: Upload generated Allure report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

  deploy-allure:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: publish-allure
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deploy-pages.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Download generated Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy Allure report to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

  report-summary:
    name: Report Summary
    runs-on: ubuntu-latest
    needs:
      - publish-allure
      - deploy-allure
      - services-smoke
    if: always()
    env:
      # Show the server URLs in the summary: a repository variable when set (an
      # externally hosted deployment), otherwise the local/in-runner default.
      FASTAPI_URL: ${{ vars.FASTAPI_URL || 'http://localhost:8000' }}
      SWAGGER_URL: ${{ vars.SWAGGER_URL || 'http://localhost:8080' }}
      GRAFANA_URL: ${{ vars.GRAFANA_URL || 'http://localhost:3001' }}

    steps:
      - name: Add report links to summary
        if: always()
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          ALLURE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/"
          DEPLOYED_URL="${{ needs.deploy-allure.outputs.page_url }}"

          if [ -n "$DEPLOYED_URL" ]; then
            ALLURE_URL="$DEPLOYED_URL"
          fi

          {
            echo "## Test Automation Reports"
            echo
            echo "| Report | Link |"
            echo "| --- | --- |"
            echo "| Allure 3 report | ${ALLURE_URL} |"
            echo "| FastAPI server | ${FASTAPI_URL} |"
            echo "| Scalar API reference | ${SWAGGER_URL} |"
            echo "| Grafana dashboard | ${GRAFANA_URL} |"
            echo
            echo "The FastAPI / Scalar / Grafana stack is ephemeral (the \`localhost\` URLs are only live inside the runner during the services-smoke job)."
            echo "Set repository variables \`FASTAPI_URL\`, \`SWAGGER_URL\`, and \`GRAFANA_URL\` to link an externally hosted deployment here instead."
          } >> "$GITHUB_STEP_SUMMARY"
