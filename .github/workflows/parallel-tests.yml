name: Parallel Test Automation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: parallel-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  tests:
    name: Playwright ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - api
          - chromium

    env:
      CI: true
      PLAYWRIGHT_MERGE_REPORTS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: matrix.project == 'chromium'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright project
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

  publish-allure:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - tests
    if: always()
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL || 'http://localhost:3000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: collected-allure-results
          merge-multiple: true

      - name: Generate Allure report
        run: |
          if find collected-allure-results -type f -print -quit 2>/dev/null | grep -q .; then
            npx allure generate collected-allure-results -o allure-report --clean
          else
            mkdir -p allure-report
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '  <h1>No Allure results were produced</h1>' \
              '  <p>The workflow completed without downloadable Allure result artifacts.</p>' \
              '</body>' \
              '</html>' \
              > allure-report/index.html
          fi

      - name: Upload generated Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy Allure report to GitHub Pages
        id: deploy-pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/deploy-pages@v4

      - name: Add report links to summary
        if: always()
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          ALLURE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/"
          DEPLOYED_URL="${{ steps.deploy-pages.outputs.page_url }}"

          if [ -n "$DEPLOYED_URL" ]; then
            ALLURE_URL="$DEPLOYED_URL"
          fi

          {
            echo "## Test Automation Reports"
            echo
            echo "| Report | Link |"
            echo "| --- | --- |"
            echo "| Allure 3 report | ${ALLURE_URL} |"
            echo "| Grafana dashboard | ${GRAFANA_URL} |"
            echo
            echo "Set the repository variable \`GRAFANA_URL\` to point this summary at your real Grafana dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
